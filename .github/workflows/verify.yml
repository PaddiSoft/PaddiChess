name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-regression:
    name: macOS · locked dependencies and regression
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      # Requires the matching bundled engines/NNUE/OCR assets in the checkout.
      # verify.sh fails explicitly on missing resources rather than silently omitting engine tests.
      - name: Check publication hygiene
        run: python3 scripts/audit-publication.py
      - name: Verify complete solution
        run: bash scripts/verify.sh
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-regression-evidence
          path: |
            artifacts/verification/**
            artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14
